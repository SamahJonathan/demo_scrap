name: CI

on:
  push:
    branches: [main, "fase/**", "inc/**"]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Linter
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Tipos
        run: mypy src/

      # Ningun test toca la red: usan respx y fixtures guardadas.
      - name: Tests
        run: pytest -q
        env:
          MP_API_TICKET: ticket-de-prueba-en-ci
