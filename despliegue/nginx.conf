# Server block para el dashboard de contratos.
#
# Se AGREGA a los sitios existentes, no los reemplaza: acp, repuestos y serena
# siguen intactos. Por eso vive en su propio archivo y usa su propio server_name.
#
# El dominio viene de sslip.io, un DNS comodin que resuelve hostnames con la IP
# embebida. Sin comprar dominio y ya en uso en este servidor.
#
# certbot agrega los bloques de SSL al ejecutarse sobre este archivo.

server {
    listen 80;
    listen [::]:80;
    server_name contratos.54-207-164-201.sslip.io;

    access_log /var/log/nginx/contratos.access.log;
    error_log  /var/log/nginx/contratos.error.log;

    # Techo generoso pero finito: el dashboard no recibe subidas.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El dashboard solo lee filas: nunca hay una respuesta lenta. Si un
        # request tarda mas de esto, algo esta mal y conviene cortarlo.
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
