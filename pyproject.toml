[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contratos"
version = "0.1.0"
description = "Reconstruye contratos públicos chilenos desde Mercado Público"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jonathan Samah" }]

# Stack fijada en docs/02-diseno.md § 4. Scrapy se descartó con criterio: son
# ~900 requests secuenciales sobre 4 fuentes distintas, no miles sobre una.
dependencies = [
    "httpx>=0.27",           # cliente HTTP: timeouts explícitos, HTTP/2
    "tenacity>=8.2",         # reintentos con backoff, declarativos
    "selectolax>=0.3.21",    # parser HTML con selectores CSS
    "pydantic>=2.7",         # entidades tipadas y validadas
    "pydantic-settings>=2.3", # carga y validación del entorno
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",           # simula respuestas HTTP: ningún test toca la red
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
contratos = "contratos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# El esquema viaja con el paquete: sin esto, un instalado no encuentra el .sql
[tool.setuptools.package-data]
contratos = ["*.sql"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
